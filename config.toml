# Table catalogs: public set catalogs with PocketBase-backed editing.

[i18n]
default = "fi"
languages = ["fi", "en"]
hidden = ["en"]

[site]
url = "https://esite.palikkaharrastajat.fi"
title = "Palikkaesitteet"
description = "Luo ja jaa pöytäesitteitä Suomen Palikkaharrastajat ry:n jäsenpalvelussa."

[site.en]
title = "Table catalogs"
description = "Create and share table catalogs with Suomen Palikkaharrastajat ry members-only service."

[metadata]
robots = "noindex, nofollow, noarchive"

[pwa]
scope = "/"
orientation = "portrait"
description = "Luo ja jaa pöytäesitteitä."

[pwa.en]
description = "Create and share table catalogs."

[navbar]
variant = "app"

[app]
pocketbase_url = "https://data.palikkaharrastajat.fi"
